name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SemVer tag
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Tag $TAG is not valid SemVer (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved $TAG → $VERSION"

      - name: Verify version sync
        run: |
          set -euo pipefail
          VERSION="$VERSION"
          echo "Checking version $VERSION across 6 sources…"
          grep -q "version: \"$VERSION\"" agent_gateway/config.yaml
          grep -q "version = \"$VERSION\"" agent_gateway/pyproject.toml
          grep -q "__version__ = \"$VERSION\"" agent_gateway/src/gateway/__init__.py
          grep -q "ARG BUILD_VERSION=$VERSION" agent_gateway/Dockerfile || grep -q "BUILD_VERSION=$VERSION" .github/workflows/ci.yml
          grep -q "## \\[$VERSION\\]" CHANGELOG.md
          grep -q "## \\[$VERSION\\]" agent_gateway/CHANGELOG.md
          echo "Version sync OK"

      - name: Extract changelog section
        id: notes
        run: |
          set -euo pipefail
          VERSION="$VERSION"
          # Extract the section for this version from CHANGELOG.md
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {p=1; print; next}
            p && $0 ~ "^## \\[" {exit}
            p {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No changelog section found for $VERSION" >&2
            exit 1
          fi
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: v${{ env.VERSION }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false

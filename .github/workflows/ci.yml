name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q

  ui:
    name: Static UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check agent_gateway/src/gateway/ui/static/app.js
      - name: No inline scripts or remote assets
        run: |
          set -euo pipefail
          if grep -nE '<script[^>]*>[^<]' agent_gateway/src/gateway/ui/static/index.html; then
            echo "inline script found"; exit 1
          fi
          if grep -nE 'https?://' agent_gateway/src/gateway/ui/static/index.html; then
            echo "remote asset reference found"; exit 1
          fi

  image:
    name: Build add-on image (amd64)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: agent_gateway
          file: agent_gateway/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ha-agent-gateway:ci
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=0.1.0

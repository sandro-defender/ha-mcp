name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q

  ui:
    name: Static UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check agent_gateway/src/gateway/ui/static/app.js
      - name: No inline scripts or remote assets
        run: |
          set -euo pipefail
          if grep -nE '<script[^>]*>[^<]' agent_gateway/src/gateway/ui/static/index.html; then
            echo "inline script found"; exit 1
          fi
          if grep -nE 'https?://' agent_gateway/src/gateway/ui/static/index.html; then
            echo "remote asset reference found"; exit 1
          fi
      - name: No browser storage for secrets
        run: |
          set -euo pipefail
          if grep -nE 'localStorage\.|sessionStorage\.|indexedDB\.' agent_gateway/src/gateway/ui/static/app.js; then
            echo "persistent browser storage found in UI"; exit 1
          fi

  packaging:
    name: Version sync & packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version is SemVer and synchronized
        run: |
          set -euo pipefail
          PY=$(grep -E '__version__ = ' agent_gateway/src/gateway/__init__.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          CFG=$(grep -E '^version:' agent_gateway/config.yaml | awk '{print $2}' | tr -d '"')
          TOML=$(grep -E '^version = ' agent_gateway/pyproject.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          DOCK=$(grep -E 'ARG BUILD_VERSION=' agent_gateway/Dockerfile | sed -E 's/.*=([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ "$PY" != "$CFG" ] || [ "$PY" != "$TOML" ] || [ "$PY" != "$DOCK" ]; then
            echo "Version mismatch: __init__.py=$PY config.yaml=$CFG pyproject.toml=$TOML Dockerfile=$DOCK" >&2
            exit 1
          fi
          if ! echo "$PY" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Version $PY is not SemVer" >&2; exit 1
          fi
          grep -q "## \[$PY\]" CHANGELOG.md || { echo "CHANGELOG.md missing section for $PY" >&2; exit 1; }
          grep -q "## \[$PY\]" agent_gateway/CHANGELOG.md || { echo "agent_gateway/CHANGELOG.md missing section for $PY" >&2; exit 1; }
          echo "Version $PY synchronized across all sources"

  image:
    name: Build add-on image (amd64)
    runs-on: ubuntu-latest
    needs: [python, ui, packaging]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve version
        id: version
        run: echo "value=$(grep -E '^version:' agent_gateway/config.yaml | awk '{print $2}' | tr -d '\"')" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: agent_gateway
          file: agent_gateway/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ha-agent-gateway:ci
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.version.outputs.value }}

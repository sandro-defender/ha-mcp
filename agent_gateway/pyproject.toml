[project]
name = "ha-agent-gateway"
version = "0.2.1"
description = "Policy-controlled gateway for AI agents to operate Home Assistant and Proxmox VE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
urls = { Homepage = "https://github.com/sandro-defender/ha-mcp", Repository = "https://github.com/sandro-defender/ha-mcp", Changelog = "https://github.com/sandro-defender/ha-mcp/blob/main/CHANGELOG.md", Issues = "https://github.com/sandro-defender/ha-mcp/issues" }
dependencies = [
  "fastapi==0.159.1",
  "uvicorn[standard]==0.54.0",
  "mcp==2.3.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "asyncssh==2.24.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
]

[project.scripts]
ha-agent-gateway = "gateway.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gateway = ["ui/static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:gateway.*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
  "S101",   # assertions are used in tests and for invariants
  "S104",   # binding 0.0.0.0 is required inside the add-on container
  "B008",   # FastAPI dependency defaults
  "SIM105", # contextlib.suppress is not always clearer
  "ASYNC109", # connector functions intentionally take an explicit timeout budget
  "S608",   # SQL fragments are constants; values are always parameterized
  "S105",   # token prefixes and header names are not secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311", "S324"]
"src/gateway/vault/*" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
mypy_path = "src"
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["asyncssh.*", "argon2.*"]
ignore_missing_imports = true

name: "Home Assistant Agent Gateway"
version: "0.4.2"
slug: "ha_agent_gateway"
description: "Policy-controlled gateway for AI agents to operate Home Assistant, Proxmox VE, and restricted SSH targets without receiving credentials."
url: "https://github.com/sandro-defender/ha-mcp"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: "mdi:shield-lock-outline"
panel_title: "Agent Gateway"
panel_admin: true
breaking_versions: []
map:
  - type: ssl
    read_only: true
ports:
  8098/tcp: null
ports_description:
  8098/tcp: "Agent REST and MCP API (off by default; enable only on a trusted LAN/VPN)"
watchdog: "http://[HOST]:[PORT:8099]/healthz"
options:
  log_level: "info"
  admin_user_ids: []
  tls_certfile: ""
  tls_keyfile: ""
  audit_retention_days: 30
  approval_ttl_seconds: 600
  auto_shutdown_enabled: true
  auto_shutdown_timeout_minutes: 30
  # Explicit trusted reverse proxies / Supervisor frontends whose
  # X-Forwarded-For chain may be used to derive client IPs for IP rules.
  # Leave empty to always use the socket peer address.
  trusted_proxies: []
schema:
  log_level: "list(debug|info|warning|error)"
  admin_user_ids:
    - "str"
  tls_certfile: "str"
  tls_keyfile: "str"
  audit_retention_days: "int(1,3650)"
  approval_ttl_seconds: "int(30,3600)"
  auto_shutdown_enabled: "bool"
  auto_shutdown_timeout_minutes: "int(5,1440)"
  # NOTE: in the Supervisor schema DSL a string of the form `list(a|b)` is an
  # *enum* (one of the |-split values), NOT "list of". Real list options use
  # the YAML list form below (same as admin_user_ids).
  trusted_proxies:
    - "str"

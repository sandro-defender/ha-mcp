[pytest]
# Running `pytest` from the repository root should behave exactly like running
# it inside `agent_gateway/`. The canonical settings live in
# agent_gateway/pyproject.toml; these mirror them so both entry points work.
testpaths = agent_gateway/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:gateway.*
